[project]
name = "crate"
version = "0.1.0"
description = "Personal crate-digging agent: library, taste, obscure discovery, production teardowns, voice-safe post drafts"
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version<'3.11'", "mutagen>=1.47", "requests>=2.31"]

[project.optional-dependencies]
audio = ["numpy>=1.26", "scipy>=1.11", "librosa>=0.10", "soundfile>=0.12", "pyloudnorm>=0.1.1"]
llm = ["anthropic>=0.40"]
dev = ["pytest"]

[project.scripts]
crate = "crate.cli:main"
mermanos = "crate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
